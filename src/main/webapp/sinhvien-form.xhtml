<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:ui="jakarta.faces.facelets" xmlns:f="jakarta.faces.core">
<ui:composition template="/templates/layout.xhtml">
<ui:define name="title">Form sinh viên</ui:define>
<ui:define name="content">
<div class="card">
<h2>#{sinhVienBean.sinhVien.id == 0 ? 'Thêm' : 'Sửa'} sinh viên</h2>
<h:messages globalOnly="true" infoClass="msg" errorClass="msg error"/>
<h:form>
<div class="form-grid">
<h:outputLabel for="ma" value="Mã sinh viên"/>
<div><h:inputText id="ma" value="#{sinhVienBean.sinhVien.maSinhVien}" required="true" requiredMessage="Mã sinh viên bắt buộc nhập"/>
<h:message for="ma" styleClass="error"/></div>
<h:outputLabel for="hoten" value="Họ tên"/>
<div><h:inputText id="hoten" value="#{sinhVienBean.sinhVien.hoTen}" required="true" requiredMessage="Họ tên bắt buộc nhập"/>
<h:message for="hoten" styleClass="error"/></div>
<h:outputLabel for="email" value="Email"/>
<div><h:inputText id="email" value="#{sinhVienBean.sinhVien.email}"/><h:message for="email" styleClass="error"/></div>
<h:outputLabel for="lop" value="Lớp"/>
<div>
<h:selectOneMenu id="lop" value="#{sinhVienBean.sinhVien.lop}" required="true" requiredMessage="Vui lòng chọn lớp">
<f:selectItem itemLabel="-- Chọn lớp --" itemValue=""/>
<f:selectItem itemLabel="DCCNTT15.10.1" itemValue="DCCNTT15.10.1"/>
<f:selectItem itemLabel="DCCNTT15.10.2" itemValue="DCCNTT15.10.2"/>
<f:selectItem itemLabel="DCCNTT15.10.3" itemValue="DCCNTT15.10.3"/>
</h:selectOneMenu>
<h:message for="lop" styleClass="error"/>
</div>
</div>
<br/>
<h:commandButton value="Lưu" action="#{sinhVienBean.save}"/>
</h:form>
</div>
</ui:define>
</ui:composition>
</html>
