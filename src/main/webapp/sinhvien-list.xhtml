<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core" xmlns:ui="jakarta.faces.facelets">
<ui:composition template="/templates/layout.xhtml">
<ui:define name="title">Danh sách sinh viên</ui:define>
<ui:define name="content">
<div class="card">
<h2>Danh sách sinh viên</h2>
<h:messages globalOnly="true" infoClass="msg" errorClass="msg error"/>
<h:form>
<h:panelGroup layout="block" style="margin-bottom:15px">
<h:inputText value="#{sinhVienBean.keyword}" style="width:70%" placeholder="Tìm theo họ tên hoặc lớp"/>
<h:commandButton value="Tìm kiếm" action="#{sinhVienBean.getDsSinhVien}" style="margin-left:8px"/>
<h:link outcome="/sinhvien-form" value="Thêm mới" styleClass="btn" style="margin-left:8px"/>
</h:panelGroup>
<h:dataTable value="#{sinhVienBean.dsSinhVien}" var="sv">
<h:column><f:facet name="header">ID</f:facet>#{sv.id}</h:column>
<h:column><f:facet name="header">Mã SV</f:facet>#{sv.maSinhVien}</h:column>
<h:column><f:facet name="header">Họ tên</f:facet>#{sv.hoTen}</h:column>
<h:column><f:facet name="header">Email</f:facet>#{sv.email}</h:column>
<h:column><f:facet name="header">Lớp</f:facet>#{sv.lop}</h:column>
<h:column>
<f:facet name="header">Thao tác</f:facet>
<h:commandButton value="Sửa" action="#{sinhVienBean.edit(sv)}" styleClass="btn-edit"/>
<h:outputText value=" "/>
<h:commandButton value="Xóa" action="#{sinhVienBean.delete(sv.id)}" styleClass="btn-danger"/>
</h:column>
</h:dataTable>
</h:form>
</div>
</ui:define>
</ui:composition>
</html>
