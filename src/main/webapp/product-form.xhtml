<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core" xmlns:ui="jakarta.faces.facelets">
<ui:composition template="/templates/layout.xhtml">
<ui:define name="title">Sản phẩm</ui:define>
<ui:define name="content">
<div class="card"><h2>Thêm sản phẩm</h2><h:messages globalOnly="true"/>
<h:form>
<div class="form-grid">
<h:outputLabel for="ten" value="Tên sản phẩm"/><div><h:inputText id="ten" value="#{productBean.product.tenSanPham}" required="true"/><h:message for="ten" styleClass="error"/></div>
<h:outputLabel for="gia" value="Giá"/><div><h:inputText id="gia" value="#{productBean.product.gia}" required="true"/><h:message for="gia" styleClass="error"/></div>
<h:outputLabel for="sl" value="Số lượng"/><div><h:inputText id="sl" value="#{productBean.product.soLuong}" required="true"/><h:message for="sl" styleClass="error"/></div>
</div><br/><h:commandButton value="Lưu sản phẩm" action="#{productBean.save}"/>
</h:form></div>
<div class="card"><h2>Danh sách sản phẩm</h2>
<h:dataTable value="#{productBean.dsProduct}" var="p">
<h:column><f:facet name="header">ID</f:facet>#{p.id}</h:column>
<h:column><f:facet name="header">Tên</f:facet>#{p.tenSanPham}</h:column>
<h:column><f:facet name="header">Giá</f:facet>#{p.gia}</h:column>
<h:column><f:facet name="header">Số lượng</f:facet>#{p.soLuong}</h:column>
</h:dataTable></div>
</ui:define></ui:composition></html>
