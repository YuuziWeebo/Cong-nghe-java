<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Khóa học</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div th:replace="~{fragments :: navbar}"></div><main class="container"><div class="badge">COURSES</div><h1>Danh sách khóa học</h1><p class="lead">5 khóa học mẫu được duyệt bằng vòng lặp <code>th:each</code>.</p><div class="table-wrap"><table><thead><tr><th>Mã môn</th><th>Tên môn</th><th>Số tín chỉ</th></tr></thead><tbody><tr th:each="c : ${courses}"><td th:text="${c.code}"></td><td th:text="${c.name}"></td><td th:text="${c.credits}"></td></tr></tbody></table></div></main><div th:replace="~{fragments :: footer}"></div></body></html>
