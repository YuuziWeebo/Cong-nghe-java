<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Danh sách sinh viên</title>
<style>
body{font-family:Arial,sans-serif;max-width:1000px;margin:40px auto;padding:0 20px;background:#f7f7f7}
.card{background:white;padding:24px;border-radius:10px;box-shadow:0 2px 8px #ddd}
table{width:100%;border-collapse:collapse;margin-top:20px}th,td{padding:10px;border-bottom:1px solid #ddd;text-align:left}
a,button{padding:7px 10px;text-decoration:none;border:0;border-radius:5px;cursor:pointer} .primary{background:#2563eb;color:white}
.search{display:flex;gap:8px}.search input{flex:1;padding:9px}
</style></head>
<body><div class="card">
<h1>Quản lý sinh viên</h1>
<div class="search">
<form th:action="@{/students}" method="get" style="display:flex;gap:8px;width:100%">
<input name="keyword" th:value="${keyword}" placeholder="Tìm theo họ tên">
<button type="submit">Tìm kiếm</button>
<a class="primary" th:href="@{/students/create}">+ Thêm sinh viên</a>
</form></div>
<table><thead><tr><th>ID</th><th>Mã SV</th><th>Họ tên</th><th>Email</th><th>Lớp</th><th>Thao tác</th></tr></thead>
<tbody><tr th:each="s : ${students}">
<td th:text="${s.id}"></td><td th:text="${s.studentCode}"></td><td th:text="${s.fullName}"></td>
<td th:text="${s.email}"></td><td th:text="${s.className}"></td>
<td><a th:href="@{/students/{id}(id=${s.id})}">Xem</a>
<a th:href="@{/students/edit/{id}(id=${s.id})}">Sửa</a>
<form th:action="@{/students/delete/{id}(id=${s.id})}" method="post" style="display:inline" onsubmit="return confirm('Xóa sinh viên này?')">
<button type="submit">Xóa</button></form></td></tr>
<tr th:if="${#lists.isEmpty(students)}"><td colspan="6">Không có sinh viên.</td></tr></tbody></table>
</div></body></html>
